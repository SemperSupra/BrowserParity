name: Edge0 Resident Weight Accounting Repeatability
on:
  push:
    branches: ["research/edge0-budget-repeat-*"]
permissions:
  contents: read
concurrency:
  group: edge0-weight-budget-${{ github.ref }}
  cancel-in-progress: true
jobs:
  budget-oracle:
    name: Edge0 resident budget ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      EDGE0_SHA: f6bfa5546bcf89919f86946ec669bcc7f4cd526d
      CENSUS_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact pinned upstream source and native CPU test target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git init -q
          git remote add origin https://github.com/Edge0-AI/Edge0.git
          git sparse-checkout init --cone
          git sparse-checkout set edge0-infer
          git fetch -q --depth=1 --filter=blob:none origin "$EDGE0_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EDGE0_SHA"
          cd edge0-infer
          cmake --preset cpu
          cmake --build --preset cpu --target moe_test_weights_mixed --parallel 2
          test -x build/cpu/bin/moe_test_weights_mixed
      - name: Repeat actual source budget equality oracle 40 times without model assets
        run: |
          set -euo pipefail
          python3 experiments/edge0-budget-repeat/receipt.py \
            --binary "$RUNNER_TEMP/upstream/edge0-infer/build/cpu/bin/moe_test_weights_mixed" \
            --repetitions 20
      - name: Evidence ceiling
        if: always()
        run: |
          echo 'Fresh-process 20 default + 20 single-allocator-arena reps; preserves failures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No 35B weights, stress workload, private data, credentials, or mainline mutation.' >> "$GITHUB_STEP_SUMMARY"
