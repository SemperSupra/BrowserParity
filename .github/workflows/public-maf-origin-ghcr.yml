name: Public MAF GHCR Versus Pinned HF Origin Read-only Qualification
on:
  push:
    branches: ["research/maf-origin-ghcr-*"]
permissions:
  contents: read
  packages: read
concurrency:
  group: bp-maf-origin-bakeoff-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-origin-cold:
    name: Same-model verified acquisition ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            order: ghcr-first
          - runner: ubuntu-24.04-arm
            order: origin-first
    env:
      MAF_SHA: 6bc5750dcd947cbbf8b3a11e80afbabd81c19ed6
      BP_GHA_SHA: ${{ github.sha }}
      RUNNER_LABEL: ${{ matrix.runner }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: Fetch pinned public MAF source, candidate and approved catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maf"
          cd "$RUNNER_TEMP/maf"
          git init -q
          git remote add origin https://github.com/SemperSupra/model-artifact-foundry.git
          git sparse-checkout init --cone
          git sparse-checkout set tools catalog candidates
          git fetch -q --depth=1 --filter=blob:none origin "$MAF_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$MAF_SHA"
      - name: Cold approved GHCR and exact-origin downloads in reversed order
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/maf"
          python3 "$GITHUB_WORKSPACE/experiments/maf-ghcr-origin/bench.py" --order "${{ matrix.order }}"
      - name: Evidence ceiling
        if: always()
        run: echo "One exploratory rep per architecture, not a controlled benchmark; no model writes to GHCR, no persistent runner cache, no inference." >> "$GITHUB_STEP_SUMMARY"
