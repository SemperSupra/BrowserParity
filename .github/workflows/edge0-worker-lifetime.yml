name: Edge0 Allocation-Capture Lifetime A-B CPU Experiment
on:
  push:
    branches: ["research/edge0-worker-lifetime-*"]
permissions:
  contents: read
concurrency:
  group: edge0-worker-lifetime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifetime-ab:
    name: Edge0 worker future A-B ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      EDGE0_SHA: f6bfa5546bcf89919f86946ec669bcc7f4cd526d
      CENSUS_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact public source and compile original failing native unit binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git init -q
          git remote add origin https://github.com/Edge0-AI/Edge0.git
          git sparse-checkout init --cone
          git sparse-checkout set edge0-infer
          git fetch -q --depth=1 --filter=blob:none origin "$EDGE0_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EDGE0_SHA"
          cd edge0-infer
          cmake --preset cpu
          cmake --build --preset cpu --target moe_test_weights_mixed --parallel 2
          cp build/cpu/bin/moe_test_weights_mixed "$RUNNER_TEMP/baseline-budget"
      - name: Apply one strictly verified worker-lifetime change in ephemeral source copy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/upstream/edge0-infer"
          python3 "$GITHUB_WORKSPACE/experiments/edge0-worker-lifetime/ab.py" \
            --patch-runtime src/weights/runtime.cpp
          cmake --build --preset cpu --target moe_test_weights_mixed --parallel 2
      - name: Run original and candidate against 400 fresh native unit processes
        run: |
          set -euo pipefail
          python3 experiments/edge0-worker-lifetime/ab.py \
            --baseline "$RUNNER_TEMP/baseline-budget" \
            --candidate "$RUNNER_TEMP/upstream/edge0-infer/build/cpu/bin/moe_test_weights_mixed" \
            --reps 200
      - name: Receipt scope
        if: always()
        run: |
          echo 'A/B traces are synthetic source/unit evidence only, not full model validation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No upstream PR or merge, 35B checkpoint, paid runner, private source, API keys or account.' >> "$GITHUB_STEP_SUMMARY"
