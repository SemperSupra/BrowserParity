name: Edge0 Finite-Double JSON Boundary Qualification
on:
  push:
    branches: ["research/edge0-json-overflow-*"]
permissions:
  contents: read
concurrency:
  group: edge0-json-${{ github.ref }}
  cancel-in-progress: true
jobs:
  roundtrip:
    name: Edge0 JSON x64-ARM ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      EDGE0_SHA: f6bfa5546bcf89919f86946ec669bcc7f4cd526d
      CENSUS_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build exact upstream unmodified JSON probe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git init -q
          git remote add origin https://github.com/Edge0-AI/Edge0.git
          git sparse-checkout init --cone
          git sparse-checkout set edge0-infer
          git fetch -q --depth=1 --filter=blob:none origin "$EDGE0_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EDGE0_SHA"
          cd edge0-infer
          cmake --preset cpu
          cmake --build --preset cpu --target moe_json_probe --parallel 2
          cp build/cpu/bin/moe_json_probe "$RUNNER_TEMP/original-json"
      - name: Patch a single JSON precision condition ONLY in disposable source copy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/upstream/edge0-infer"
          python3 "$GITHUB_WORKSPACE/experiments/edge0-json-overflow/ab.py" --patch-source src/model/json.cpp
          cmake --build --preset cpu --target moe_json_probe --parallel 2
      - name: A/B test source original and patched against upstream Python oracle
        run: |
          set -euo pipefail
          python3 experiments/edge0-json-overflow/ab.py \
            --checker "$RUNNER_TEMP/upstream/edge0-infer/tests/unit/model/check_json.py" \
            --baseline "$RUNNER_TEMP/original-json" \
            --candidate "$RUNNER_TEMP/upstream/edge0-infer/build/cpu/bin/moe_json_probe"
      - name: Evidence ceiling
        if: always()
        run: |
          echo 'No real 35B model, private data, paid GHA runner, account or token, and no upstream write.' >> "$GITHUB_STEP_SUMMARY"
